# Single-cycle stack: raw V/I/T discharge curves → BiLSTM (+ LR / XGB baselines)
# Mirrors the proof-of-concept training notebook.

save_dir: saved_models/single_cycle

architecture:
  n_timesteps: 1000
  units: [128, 64, 32]
  dropouts: [0.3, 0.3, 0.2]
  head_units: 32

training:
  epochs: 100
  batch_size: 32
  patience: 12
  learning_rate: 0.0003
  verbose: 1

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.3

data:
  data_dir: data/raw/BatteryAgingARC-FY08Q4
  battery_ids: [5, 6, 7, 18]
  train_batteries: [B0006, B0007]
  test_battery: B0005
  channels:
    - Voltage_measured
    - Current_measured
    - Temperature_measured

evaluation:
  metrics: [rmse, mae, r2]
