# XGBoost Configuration for SOH Estimation
# ============================================

model:
  name: xgboost_soh
  type: xgboost

hyperparameters:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  reg_alpha: 0.1
  reg_lambda: 1.0
  objective: reg:squarederror
  eval_metric: rmse
  early_stopping_rounds: 30

data:
  dataset: nasa_pcoe
  batteries: [B0005, B0006, B0007, B0018]
  validation_strategy: lobo
  scaler: standard
  features:
    - cycle_number
    - discharge_capacity
    - charge_time
    - avg_voltage
    - avg_temperature
    - voltage_std
    - temp_range
    - capacity_delta          # Change from previous cycle

evaluation:
  metrics: [rmse, mae, r2, mape]
