# LSTM Configuration for RUL + Capacity Forecast
# ================================================

model:
  name: lstm_rul_capacity
  type: lstm

architecture:
  input_window: 10          # Number of past cycles as input
  forecast_horizon: 10      # Multi-step ahead prediction
  lstm_units: [64, 32]      # Units per LSTM layer
  dropout: 0.2
  dense_units: [16]
  activation: relu
  output_activation: linear

training:
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  optimizer: adam
  loss: mse
  early_stopping:
    patience: 20
    monitor: val_loss
    restore_best_weights: true

data:
  dataset: nasa_pcoe
  batteries: [B0005, B0006, B0007, B0018]
  validation_strategy: lobo   # Leave-One-Battery-Out
  scaler: minmax
  features:
    - cycle_number
    - discharge_capacity
    - charge_time
    - avg_voltage
    - avg_temperature
    - voltage_std
    - temp_range

evaluation:
  metrics: [rmse, mae, r2, mape]
