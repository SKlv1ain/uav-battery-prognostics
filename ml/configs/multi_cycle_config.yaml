# Multi-cycle stack: summarised features + sliding-window BiLSTM
# Mirrors the proof-of-concept training notebook.

save_dir: saved_models/multi_cycle

architecture:
  window_size: 15
  units: [128, 64, 32]
  dropout: 0.2

training:
  epochs: 1000
  patience: 15
  validation_split: 0.2
  learning_rate: 0.0001
  verbose: 1

xgboost:
  n_estimators: 200
  max_depth: 10
  learning_rate: 0.05

data:
  data_dir: data/raw/BatteryAgingARC-FY08Q4
  battery_ids: [5, 6, 7, 18]
  train_batteries: [B0006, B0007, B0018]
  test_battery: B0005
  target: capacity
  features:
    - cycle
    - duration
    - avg_temp
    - v_drop
    - v_decay_rate
    - temp_stability
    - cumulative_duration

evaluation:
  metrics: [rmse, mae, r2]
